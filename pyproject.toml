[project]
name = "market-intelligence"
version = "0.1.0"
description = "Asynchronous AI-powered market intelligence and research platform"
readme = "README.md"
authors = [
    { name = "AnupamKNN", email = "anupam848484@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "authlib>=1.9.5",
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "fastmcp>=4.1.8",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-redis>=0.2.6",
    "langgraph>=1.2.20",
    "pwdlib[argon2]>=0.4.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "redis[hiredis]>=8.1,<9",
]

[project.scripts]
market-intelligence = "market_intelligence:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "asyncpg>=0.32.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "ucimlrepo>=0.0.7",
]
deep-learning = [
    "torch>=2.14.1,<2.15",
]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.4",
    "optuna>=5.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
mcp = [
    "fastmcp>=4.1.6",
]
ml = [
    "scikit-learn>=1.9.1",
]

# ==========================================
# PyTorch CUDA configuration
# ==========================================

[tool.uv]
default-groups = "all"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

# ==========================================
# Ruff - Linting and Formatting
# ==========================================

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",       # Import errors
    "E7",       # Statement errors
    "E9",       # Runtime errors
    "F",        # Pyflakes
    "I",        # Import sorting
    "UP",       # Python modernization
    "B",        # Bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ==========================================
# Pytest - Testing Configuration
# ==========================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-markers",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
